# DataFlow – local stack
#
#   First time:  docker compose up airflow-init
#   Then:        docker compose up -d
#   UI:          http://localhost:8080  (admin / admin)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: dataflow-airflow:latest
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-change-me}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Inside Docker, services reach each other by service name + internal port.
    # These override the localhost values that .env uses for your laptop.
    WAREHOUSE_HOST: warehouse-db
    WAREHOUSE_PORT: 5432
    SOURCE_DB_HOST: source-db
    SOURCE_DB_PORT: 5432
    PAYMENTS_API_URL: http://mock-payments-api:8000
    DATA_DIR: /opt/airflow/data/generated
    DBT_HOST: warehouse-db
    DBT_PORT: 5432
    DBT_PROFILES_DIR: /opt/airflow/dbt_dataflow
    DBT_PROJECT_DIR: /opt/airflow/dbt_dataflow
    PIPELINE_PYTHON: /opt/pipeline_venv/bin/python
    DBT_BIN: /opt/pipeline_venv/bin/dbt
    PROJECT_ROOT: /opt/airflow
    # Airflow connection used by the metrics task (PostgresHook conn_id "dataflow_warehouse")
    AIRFLOW_CONN_DATAFLOW_WAREHOUSE: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse-db:5432/${WAREHOUSE_DB}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion
    - ./data_generators:/opt/airflow/data_generators
    - ./docker/postgres/source:/opt/airflow/docker/postgres/source:ro
    - ./dbt_dataflow:/opt/airflow/dbt_dataflow
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"

x-airflow-depends-on: &airflow-depends-on
  airflow-db:
    condition: service_healthy
  warehouse-db:
    condition: service_healthy
  source-db:
    condition: service_healthy

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5

services:
  # ---------- Airflow metadata DB (Airflow's own bookkeeping) ----------
  airflow-db:
    image: postgres:15
    container_name: dataflow-airflow-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  # ---------- Warehouse (raw / quarantine / staging / analytics / observability) ----------
  warehouse-db:
    image: postgres:15
    container_name: dataflow-warehouse-db
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
      - ./docker/postgres/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  # ---------- Source system (fake e-commerce OLTP DB) ----------
  source-db:
    image: postgres:15
    container_name: dataflow-source-db
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      POSTGRES_DB: ${SOURCE_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - source-db-data:/var/lib/postgresql/data
      - ./docker/postgres/source:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  # ---------- Mock payments REST API (FastAPI) ----------
  mock-payments-api:
    build:
      context: .
      dockerfile: api/mock_payments/Dockerfile
    image: dataflow-mock-payments:latest
    container_name: dataflow-mock-payments-api
    environment:
      PAYMENTS_FILE: /app/data/generated/payments.json
      API_FAILURE_RATE: ${API_FAILURE_RATE:-0.1}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Optional BI tool: docker compose --profile bi up -d metabase ----------
  metabase:
    image: metabase/metabase:v0.50.36
    container_name: dataflow-metabase
    profiles: ["bi"]
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Airflow: one-time setup (migrate DB + create admin user) ----------
  airflow-init:
    <<: *airflow-common
    container_name: dataflow-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      <<: *airflow-depends-on

  airflow-webserver:
    <<: *airflow-common
    container_name: dataflow-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: dataflow-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
      mock-payments-api:
        condition: service_healthy

volumes:
  airflow-db-data:
  warehouse-db-data:
  source-db-data:
  metabase-data:
